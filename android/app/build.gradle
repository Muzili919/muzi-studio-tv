plugins { id 'com.android.application' }

def signingProps = new java.util.Properties()
def signingFile = rootProject.file('../signing.env')
if (!signingFile.exists()) signingFile = rootProject.file('signing.env')
if (signingFile.exists()) signingFile.withReader('UTF-8') { signingProps.load(it) }

def prop = { String key ->
    def env = System.getenv(key)
    if (env) return env
    return signingProps.getProperty(key)
}

def muziBase = (project.findProperty('muziBaseUrl') ?: 'https://zhishixingqiu.top/tv').toString().replaceAll(/\/+$/, '')
def muziUpdate = (project.findProperty('muziUpdateUrl') ?: (muziBase + '/version.json')).toString()

android {
 namespace 'studio.muzi.tv'
 compileSdk 34
 buildFeatures { buildConfig true }
 defaultConfig {
  applicationId 'studio.muzi.tv'
  minSdk 23
  targetSdk 34
  versionCode = (project.findProperty('muziVersionCode') ?: '127').toInteger()
  versionName = (project.findProperty('muziVersionName') ?: '1.2.6').toString()
  buildConfigField 'String', 'UPDATE_URL', '"' + muziUpdate.replace('\\', '\\\\').replace('"', '\\"') + '"'
 }
 signingConfigs {
  release {
   def store = prop('MUZI_KEYSTORE')
   if (store) {
    storeFile file(store)
    storePassword prop('MUZI_KEYSTORE_PASSWORD')
    keyAlias prop('MUZI_KEY_ALIAS') ?: 'muzi-tv'
    keyPassword prop('MUZI_KEY_PASSWORD') ?: prop('MUZI_KEYSTORE_PASSWORD')
   }
  }
 }
 buildTypes {
  release {
   minifyEnabled false
   if (prop('MUZI_KEYSTORE')) signingConfig signingConfigs.release
  }
 }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_1_8
  targetCompatibility JavaVersion.VERSION_1_8
 }
}

dependencies {
 implementation 'androidx.media3:media3-exoplayer:1.3.1'
 implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
}
